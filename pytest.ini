[pytest]
asyncio_mode = auto
asyncio_default_fixture_loop_scope = session
asyncio_default_test_loop_scope = session

pythonpath = .
addopts = --import-mode=importlib

markers =
    open_notebook: marks tests that require a live Open Notebook connection (auto-skipped when not running)
    real_provider: real-provider smoke gate against the live stack (skipped unless RUN_REAL_PROVIDER_SMOKE=1)
